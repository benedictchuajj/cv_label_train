[project]
name = "yolo-train"
version = "0.1.0"
description = "Train DETR/YOLO on aerial images with SAM-assisted labeling"
requires-python = ">=3.10"
dependencies = [
    "ultralytics>=8.3.0",
    "sam2>=1.0",
    "opencv-python>=4.8.0",
    "matplotlib>=3.8.0",
    "numpy>=1.24.0",
    "tqdm>=4.66.0",
    "jupyter>=1.0.0",
    "ipywidgets>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
